<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#fff8ee" />
<meta name="robots" content="noindex, nofollow" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Crumb" />
<title>Crumb</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22%23c9331f%22%2F%3E%3Ccircle%20cx%3D%2222%22%20cy%3D%2240%22%20r%3D%228%22%20fill%3D%22%23ffd45c%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2226%22%20r%3D%2210%22%20fill%3D%22%23fff8ee%22%2F%3E%3Ccircle%20cx%3D%2244%22%20cy%3D%2246%22%20r%3D%225%22%20fill%3D%22%23f58a1f%22%2F%3E%3C%2Fsvg%3E" />
<style>@import url("https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&display=swap");

/* ============ Crumb design tokens ============ */
:root {
  --tomato: #e8432e;
  --tomato-deep: #c9331f; /* text-safe tomato on light backgrounds */
  --tomato-soft: #fde1db;
  --tangerine: #f58a1f;
  --tangerine-soft: #fee6cc;
  --butter: #ffd45c;
  --butter-soft: #fff1c2;
  --cobalt: #2547d0;
  --cobalt-deep: #1c37a6;
  --cobalt-soft: #dde4fb;
  --cream: #fff8ee; /* warm off-white page */
  --paper: #ffffff;
  --sand: #f4eadb; /* quiet surfaces */
  --line: #e7dccb;
  --ink: #2a1f1a;
  --ink-2: #5b4c42; /* muted text, 7:1 on cream */
  --ink-3: #85766b;

  --font-display: "Fredoka", "Nunito", ui-rounded, system-ui, sans-serif;
  --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;

  --r-sm: 10px;
  --r-md: 16px;
  --r-lg: 24px;
  --r-pill: 999px;
  --shadow-card: 0 1px 0 rgba(42, 31, 26, 0.04), 0 8px 24px -12px rgba(42, 31, 26, 0.18);
  --shadow-sticker: 2px 2px 0 var(--ink);
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--cream);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
button:disabled { cursor: not-allowed; opacity: 0.5; }
img { display: block; max-width: 100%; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--cobalt); outline-offset: 2px; border-radius: 6px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

/* ============ Type ============ */
.h-display { font-family: var(--font-display); font-weight: 600; letter-spacing: -0.01em; margin: 0; line-height: 1.1; }
.h-xl { font-size: clamp(34px, 5.2vw, 60px); font-weight: 700; }
.h-lg { font-size: clamp(30px, 4vw, 46px); font-weight: 700; }
.h-md { font-size: clamp(22px, 2.4vw, 28px); }
.h-sm { font-size: 20px; }
.muted { color: var(--ink-2); }
.small { font-size: 14px; }
.pad { padding: 40px; }

/* ============ Layout helpers ============ */
.row { display: flex; align-items: center; }
.col { display: flex; flex-direction: column; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.gap-xs { gap: 6px; } .gap-sm { gap: 10px; }
.end { justify-content: flex-end; } .center { justify-content: center; }

/* ============ Buttons ============ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 44px; padding: 0 18px; border-radius: var(--r-pill);
  font-weight: 700; font-size: 15px; white-space: nowrap; text-decoration: none;
  transition: transform 0.18s var(--spring), background 0.15s, box-shadow 0.15s;
}
.btn:not(:disabled):hover { transform: translateY(-1px); }
.btn:not(:disabled):active { transform: translateY(1px) scale(0.98); }
.btn-sm { height: 36px; padding: 0 14px; font-size: 14px; }
.btn-lg { height: 52px; padding: 0 24px; font-size: 16px; }
.btn.block { width: 100%; }
.btn-primary { background: var(--tomato-deep); color: #fff; box-shadow: 0 3px 0 #8f2213; }
.btn-primary:not(:disabled):hover { background: var(--tomato); box-shadow: 0 4px 0 #8f2213; }
.btn-cobalt { background: var(--cobalt); color: #fff; box-shadow: 0 3px 0 #13277a; }
.btn-cobalt:hover { background: var(--cobalt-deep); }
.btn-outline { background: var(--paper); border: 2px solid var(--ink); color: var(--ink); }
.btn-ghost { background: transparent; color: var(--ink); }
.btn-ghost:hover { background: var(--sand); }
.btn-danger { background: var(--ink); color: #fff; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 50%; display: inline-grid; place-items: center;
  color: var(--ink-2); transition: background 0.15s, color 0.15s;
}
.icon-btn:hover { background: var(--sand); color: var(--ink); }
.icon-btn.lg { width: 44px; height: 44px; }
.link-btn { color: var(--cobalt); font-weight: 700; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }
.link-btn.light { color: var(--butter); }

/* ============ App shell ============ */
.app { min-height: 100vh; }
.demo-banner {
  background: var(--ink); color: var(--butter-soft); font-size: 13px; text-align: center;
  padding: 7px 12px; display: flex; gap: 6px; align-items: center; justify-content: center;
}
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px clamp(16px, 4vw, 40px); max-width: 1480px; margin: 0 auto;
}
.main { max-width: 1480px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 40px) 80px; }

.logo { display: inline-flex; align-items: flex-end; gap: 3px; }
.logo-word { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1; color: var(--tomato-deep); letter-spacing: -0.02em; }
.logo-dots { display: inline-flex; gap: 3px; padding-bottom: 5px; }
.logo-dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--tangerine); display: block; }
.logo-dots i:nth-child(2) { width: 4px; height: 4px; background: var(--butter); transform: translateY(-5px); }
.logo-dots i:nth-child(3) { width: 5px; height: 5px; background: var(--cobalt); }
.logo:hover .logo-dots i { animation: hop 0.5s var(--spring); }
.logo:hover .logo-dots i:nth-child(2) { animation-delay: 0.06s; }
.logo:hover .logo-dots i:nth-child(3) { animation-delay: 0.12s; }
@keyframes hop { 50% { transform: translateY(-7px); } }

/* ============ Hero ============ */
.hero { position: relative; padding: clamp(12px, 3vw, 36px) 0 28px; }
.hero-kicker { font-family: var(--font-display); font-weight: 600; color: var(--tangerine); font-size: 18px; margin: 0 0 6px; }
.hero h1 { max-width: 16ch; position: relative; }
.hl { position: relative; white-space: nowrap; color: var(--ink); }
.hl::after {
  content: ""; position: absolute; left: -4px; right: -4px; bottom: 0.08em; height: 0.36em;
  background: var(--butter); border-radius: 8px; z-index: -1; transform: rotate(-1.5deg);
}
.hero h1 { z-index: 0; }
.hero-deco { position: absolute; width: 56px; height: 56px; pointer-events: none; }
.deco-1 { right: 8%; top: 8px; color: var(--butter); width: 44px; animation: twinkle 4s ease-in-out infinite; }
.deco-2 { right: 18%; top: 72px; color: var(--cobalt); width: 70px; opacity: 0.8; }
.deco-3 { right: 3%; top: 96px; color: var(--tomato); transform: rotate(18deg); }
@keyframes twinkle { 50% { transform: scale(0.8) rotate(20deg); } }
@media (max-width: 900px) { .hero-deco { display: none; } }

.search-row { display: flex; gap: 12px; margin-top: 22px; align-items: center; }
.search {
  flex: 1; display: flex; align-items: center; gap: 10px; height: 60px; padding: 0 12px 0 20px;
  background: var(--paper); border: 2px solid var(--ink); border-radius: var(--r-pill);
  box-shadow: 4px 4px 0 var(--ink); color: var(--ink-2);
  transition: box-shadow 0.15s, transform 0.15s;
}
.search:focus-within { box-shadow: 4px 4px 0 var(--cobalt); border-color: var(--cobalt); }
.search input { flex: 1; border: 0; outline: 0; background: transparent; font-size: 17px; color: var(--ink); min-width: 0; }
.search input::placeholder { color: var(--ink-3); }
.search input::-webkit-search-cancel-button { display: none; }

.shortcuts { display: flex; gap: 10px; margin-top: 22px; overflow-x: auto; padding: 4px 2px 8px; scrollbar-width: none; }
.shortcuts::-webkit-scrollbar { display: none; }
.shortcut {
  display: inline-flex; align-items: center; gap: 6px; height: 42px; padding: 0 16px 0 12px; flex-shrink: 0;
  border-radius: var(--r-pill); border: 2px solid var(--ink); font-weight: 700; font-size: 15px;
  background: var(--paper); transform: rotate(var(--tilt, 0deg));
  transition: transform 0.2s var(--spring), box-shadow 0.15s, background 0.15s;
}
.shortcut:hover { transform: rotate(0deg) translateY(-2px); box-shadow: var(--shadow-sticker); }
.shortcut-doodle { width: 22px; height: 22px; }
.shortcut.tone-butter .shortcut-doodle { color: #b88a00; }
.shortcut.tone-tangerine .shortcut-doodle { color: var(--tangerine); }
.shortcut.tone-tomato .shortcut-doodle, .shortcut.tone-tomato .icon { color: var(--tomato-deep); }
.shortcut.tone-cobalt .shortcut-doodle { color: var(--cobalt); }
.shortcut.on { box-shadow: var(--shadow-sticker); transform: rotate(0deg); }
.shortcut.on.tone-butter { background: var(--butter); }
.shortcut.on.tone-tangerine { background: var(--tangerine); }
.shortcut.on.tone-tomato { background: var(--tomato-soft); }
.shortcut.on.tone-cobalt { background: var(--cobalt); color: #fff; }
.shortcut.on.tone-cobalt .shortcut-doodle { color: #fff; }

/* ============ Library: sidebar + gallery ============ */
.library { display: grid; grid-template-columns: 290px 1fr; gap: 32px; align-items: start; }
.sidebar {
  position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow-y: auto;
  background: var(--paper); border-radius: var(--r-lg); padding: 20px; border: 1px solid var(--line);
  scrollbar-width: thin;
}
.sidebar-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.gallery-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; min-height: 36px; }
.filters-toggle { display: none; }
.result-count { margin: 0; color: var(--ink-2); font-size: 14px; font-weight: 500; }
.count-badge { background: var(--tomato-deep); color: #fff; border-radius: var(--r-pill); font-size: 12px; min-width: 20px; height: 20px; display: inline-grid; place-items: center; padding: 0 6px; }

.active-chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
.achip {
  display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: var(--r-pill);
  font-size: 14px; font-weight: 700; border: 2px solid var(--ink); background: var(--paper);
  animation: pop-in 0.25s var(--spring);
}
.achip:hover { text-decoration: line-through; }
.achip.tone-cobalt { background: var(--cobalt-soft); }
.achip.tone-tomato { background: var(--tomato-soft); }
.achip.tone-butter { background: var(--butter-soft); }
.achip.tone-tangerine { background: var(--tangerine-soft); }
.achip.tone-ink { background: var(--ink); color: #fff; }
@keyframes pop-in { from { transform: scale(0.6); opacity: 0; } }

/* Filters */
.filters { display: flex; flex-direction: column; }
.fgroup { padding: 16px 0; border-top: 1px dashed var(--line); }
.fgroup:first-child { border-top: 0; padding-top: 4px; }
.fgroup-title { font-family: var(--font-display); font-size: 16px; font-weight: 600; margin: 0 0 10px; }
.field-label { display: block; font-size: 13px; font-weight: 700; color: var(--ink-2); margin: 6px 0 6px; text-transform: none; }
.chip-wrap, .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-row { margin-bottom: 8px; }
.tchip {
  display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 0 12px; border-radius: var(--r-pill);
  background: var(--sand); color: var(--ink); font-size: 14px; font-weight: 500; border: 2px solid transparent;
  transition: background 0.15s, transform 0.18s var(--spring), border-color 0.15s;
}
.tchip:hover { border-color: var(--ink); }
.tchip.on { border-color: var(--ink); font-weight: 700; transform: rotate(-1deg); }
.tchip.on.tone-cobalt { background: var(--cobalt); color: #fff; }
.tchip.on.tone-tomato { background: var(--tomato-deep); color: #fff; }
.tchip.on.tone-butter { background: var(--butter); }
.tchip.on.tone-tangerine { background: var(--tangerine); }
.tchip.suggested { border: 2px dashed var(--ink-3); background: var(--paper); }
.tchip.suggested.on { border-style: solid; }
.sugg-mark { font-size: 11px; color: var(--ink-3); font-weight: 500; margin-left: 2px; }

.ing-picker { margin-bottom: 10px; }
.mini-search {
  display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-radius: var(--r-sm);
  background: var(--sand); color: var(--ink-3);
}
.mini-search:focus-within { outline: 2px solid var(--cobalt); }
.mini-search input { border: 0; outline: 0; background: transparent; flex: 1; font-size: 15px; color: var(--ink); min-width: 0; }
.suggest-row { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 8px; }
.suggest { font-size: 13px; font-weight: 500; color: var(--ink-2); padding: 2px 0; }
.suggest:hover { color: var(--cobalt); text-decoration: underline; }
.seg { display: flex; background: var(--sand); border-radius: var(--r-pill); padding: 3px; margin: 4px 0 12px; }
.seg button { flex: 1; height: 30px; border-radius: var(--r-pill); font-size: 12.5px; font-weight: 700; color: var(--ink-2); }
.seg button.on { background: var(--ink); color: #fff; }

/* Masonry */
.masonry { display: flex; gap: 20px; align-items: flex-start; }
.mcol { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 20px; }

/* Card */
.card {
  position: relative; background: var(--paper); border-radius: var(--r-lg); overflow: hidden;
  box-shadow: var(--shadow-card); transition: transform 0.25s var(--spring), box-shadow 0.25s;
  animation: rise 0.4s var(--ease) both;
}
.card:hover { transform: translateY(-4px) rotate(-0.4deg); box-shadow: 0 18px 36px -16px rgba(42, 31, 26, 0.32); }
.mcol:nth-child(even) .card:hover { transform: translateY(-4px) rotate(0.4deg); }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } }
.card-hit { display: block; width: 100%; text-align: left; }
.card-media { position: relative; overflow: hidden; }
.card-media .rimg-card { width: 100%; height: auto; transition: transform 0.5s var(--ease); }
.card:hover .card-media .rimg-card { transform: scale(1.04); }
.card-incomplete {
  position: absolute; left: 10px; top: 10px; display: inline-flex; align-items: center; gap: 4px;
  background: var(--paper); border: 1.5px solid var(--ink); border-radius: var(--r-pill);
  font-size: 12px; font-weight: 700; padding: 3px 9px; transform: rotate(-2deg);
}
.card-body { padding: 14px 16px 16px; }
.card-title { font-family: var(--font-display); font-weight: 600; font-size: 18px; line-height: 1.2; margin: 0 0 8px; }
.card-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; font-size: 13.5px; color: var(--ink-2); }
.meta-pill { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; color: var(--ink); margin-right: 2px; }
.card-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.mini-tag { font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: var(--r-pill); background: var(--cobalt-soft); color: var(--cobalt-deep); }
.mini-tag:nth-child(2) { background: var(--butter-soft); color: #6b4d00; }
.fav-btn {
  position: absolute; right: 10px; top: 10px; width: 38px; height: 38px; border-radius: 50%;
  background: rgba(255, 255, 255, 0.92); display: grid; place-items: center; color: var(--ink-2);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12); transition: transform 0.25s var(--spring), color 0.15s;
}
.fav-btn:hover { transform: scale(1.12); color: var(--tomato); }
.fav-btn.on { color: var(--tomato); }
.fav-btn.on .icon { animation: heart 0.4s var(--spring); }
.fav-btn.big { width: 48px; height: 48px; right: 14px; top: 14px; }
@keyframes heart { 40% { transform: scale(1.35); } }
.skeleton { background: linear-gradient(90deg, var(--sand), #fbf3e6, var(--sand)); background-size: 200% 100%; animation: shimmer 1.4s infinite; box-shadow: none; }
@keyframes shimmer { to { background-position: -200% 0; } }

/* Placeholder art */
.placeholder { position: relative; width: 100%; overflow: hidden; display: grid; place-items: center; }
.rimg-hero.placeholder { aspect-ratio: 4 / 3; }
.ph-butter { background: var(--butter); color: #8a6400; }
.ph-tangerine { background: var(--tangerine); color: #7a3c00; }
.ph-tomato { background: var(--tomato); color: #6e170b; }
.ph-cobalt { background: var(--cobalt); color: #b9c7ff; }
.ph-blob { position: absolute; width: 70%; aspect-ratio: 1; border-radius: 42% 58% 63% 37% / 41% 44% 56% 59%; background: rgba(255, 255, 255, 0.22); }
.ph-doodle { position: relative; width: 42%; max-width: 160px; }
.ph-crumbs { position: absolute; width: 30%; right: 6%; bottom: 6%; opacity: 0.7; }
.ph-initial { position: absolute; left: 12px; bottom: 4px; font-family: var(--font-display); font-weight: 700; font-size: 64px; line-height: 1; opacity: 0.18; color: #fff; }

/* Empty states */
.empty { text-align: center; padding: 60px 20px; max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty-doodle { width: 90px; height: 90px; color: var(--tangerine); animation: wobble 3s ease-in-out infinite; }
.empty p { margin: 0 0 8px; }
@keyframes wobble { 50% { transform: rotate(-8deg); } }

/* ============ Modal / sheet ============ */
.overlay { position: fixed; inset: 0; background: rgba(42, 31, 26, 0.45); z-index: 50; display: grid; place-items: center; padding: 16px; animation: fade 0.2s; }
@keyframes fade { from { opacity: 0; } }
.modal { background: var(--cream); border-radius: var(--r-lg); width: min(560px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; position: relative; animation: pop-up 0.3s var(--spring); }
@keyframes pop-up { from { transform: translateY(16px) scale(0.97); opacity: 0; } }
.overlay-sheet { place-items: end center; padding: 0; }
.modal-sheet { width: 100%; max-width: 640px; border-radius: var(--r-lg) var(--r-lg) 0 0; max-height: 88vh; display: flex; flex-direction: column; animation: slide-up 0.32s var(--ease); overflow: hidden; }
@keyframes slide-up { from { transform: translateY(100%); } }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 8px; position: relative; }
.sheet-grip { position: absolute; left: 50%; top: 8px; width: 40px; height: 4px; border-radius: 4px; background: var(--line); transform: translateX(-50%); }
.sheet-body { overflow-y: auto; padding: 0 20px; flex: 1; }
.sheet-foot { display: flex; justify-content: space-between; gap: 10px; padding: 12px 20px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--paper); }
.sheet-foot .btn-primary { flex: 1; }
.confirm { padding: 28px; display: flex; flex-direction: column; gap: 10px; }
.modal-close { position: absolute; right: 14px; top: 14px; z-index: 2; }

/* Add recipe */
.add { padding: 32px 28px 24px; }
.add-head { text-align: center; margin-bottom: 18px; }
.add-head p { margin: 6px auto 0; max-width: 40ch; }
.add-doodle { width: 56px; height: 56px; color: var(--tomato); margin: 0 auto 6px; display: block; }
.tabs { display: flex; background: var(--sand); padding: 4px; border-radius: var(--r-pill); margin-bottom: 18px; }
.tabs button { flex: 1; height: 40px; border-radius: var(--r-pill); font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; color: var(--ink-2); }
.tabs button.on { background: var(--paper); color: var(--ink); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1); }
.add-alt { text-align: center; font-size: 14px; color: var(--ink-2); margin: 18px 0 0; }
.dropzone {
  border: 2px dashed var(--ink-3); border-radius: var(--r-md); background: var(--paper); padding: 22px;
  display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; text-align: center;
  transition: border-color 0.15s, background 0.15s;
}
.dropzone:hover { border-color: var(--cobalt); background: var(--cobalt-soft); }
.shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 8px; width: 100%; }
.shot { position: relative; aspect-ratio: 9 / 16; border-radius: 8px; overflow: hidden; background: var(--sand); }
.shot img { width: 100%; height: 100%; object-fit: cover; }
.shot-x { position: absolute; right: 4px; top: 4px; width: 22px; height: 22px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; }
.shot-add { display: grid; place-items: center; color: var(--ink-3); border: 2px dashed var(--line); background: transparent; }

.working { text-align: center; padding: 16px 0 8px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.spinner-pot { position: relative; width: 84px; height: 84px; }
.pot-bob { width: 84px; height: 84px; color: var(--tomato); animation: bob 1.2s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-4px) rotate(-3deg); } }
.steam { position: absolute; top: -6px; width: 8px; height: 8px; border-radius: 50%; background: var(--tangerine); opacity: 0; animation: steam 1.8s ease-out infinite; }
.s1 { left: 30px; } .s2 { left: 40px; animation-delay: 0.5s; background: var(--butter); } .s3 { left: 50px; animation-delay: 1s; background: var(--cobalt); }
@keyframes steam { 0% { opacity: 0; transform: translateY(10px) scale(0.6); } 30% { opacity: 1; } 100% { opacity: 0; transform: translateY(-22px) scale(1.1); } }
.progress-steps { list-style: none; padding: 0; margin: 8px 0; text-align: left; display: flex; flex-direction: column; gap: 10px; }
.progress-steps li { display: flex; align-items: center; gap: 10px; color: var(--ink-3); font-weight: 500; transition: color 0.2s; }
.progress-steps li.done { color: var(--ink-2); }
.progress-steps li.now { color: var(--ink); font-weight: 700; }
.pdot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; flex-shrink: 0; }
.done .pdot { background: var(--cobalt); border-color: var(--cobalt); color: #fff; }
.now .pdot { border-color: var(--tomato); border-top-color: transparent; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.result { text-align: center; padding: 12px 0 4px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.result p { margin: 0 0 8px; max-width: 42ch; }
.result-badge { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--ink); box-shadow: var(--shadow-sticker); }
.result-badge.tone-cobalt { background: var(--cobalt); color: #fff; }
.result-badge.tone-butter { background: var(--butter); color: var(--tomato-deep); }
.result-badge.tone-tomato { background: var(--tomato-soft); color: var(--tomato-deep); }
.result-badge.tone-tangerine { background: var(--tangerine); color: var(--ink); }
.pop { animation: badge-pop 0.5s var(--spring); }
@keyframes badge-pop { from { transform: scale(0.3) rotate(-30deg); } }

/* Forms */
.field { display: flex; flex-direction: column; margin-bottom: 14px; }
.input {
  width: 100%; height: 44px; padding: 0 14px; border-radius: var(--r-sm); border: 2px solid var(--line);
  background: var(--paper); font-size: 16px; outline: 0; transition: border-color 0.15s;
}
textarea.input { height: auto; padding: 10px 14px; resize: vertical; line-height: 1.5; }
.input:focus { border-color: var(--cobalt); }
.input-lg { height: 52px; font-size: 17px; }
.form-error { background: var(--tomato-soft); color: #8f2213; font-weight: 500; padding: 10px 14px; border-radius: var(--r-sm); margin: 0 0 12px; font-size: 14px; }

/* ============ Recipe detail ============ */
.detail { max-width: 1120px; margin: 0 auto; }
.detail-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.back-btn { padding-left: 8px; }
.detail-hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 40px; align-items: center; }
.detail-media { position: relative; border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--shadow-card); }
.detail-media .rimg-hero { width: 100%; max-height: 520px; object-fit: cover; }
.sticker-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.sticker {
  display: inline-block; padding: 4px 12px; border-radius: var(--r-pill); font-weight: 700; font-size: 13px;
  border: 2px solid var(--ink); box-shadow: var(--shadow-sticker); background: var(--butter);
}
.sticker.tone-cobalt { background: var(--cobalt); color: #fff; }
.sticker.tone-tomato { background: var(--tomato-deep); color: #fff; }
.sticker.tone-tangerine { background: var(--tangerine); }
.sticker.tone-butter { background: var(--butter); }
.detail-title { margin-bottom: 20px; }
.facts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 0 0 18px; }
.facts div { background: var(--paper); border-radius: var(--r-md); padding: 10px 12px; border: 1px solid var(--line); }
.facts dt { font-size: 12px; font-weight: 700; color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.06em; }
.facts dd { margin: 2px 0 0; font-family: var(--font-display); font-size: 18px; font-weight: 600; }
.fact-total { background: var(--butter-soft) !important; border-color: var(--butter) !important; }
.estimate-note { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; font-size: 13.5px; color: var(--ink-2); margin: -6px 0 16px; }
.est-badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: var(--r-pill); border: 1.5px dashed var(--ink-3); color: var(--ink-2); background: var(--paper); }
.est-badge.sm { font-size: 10.5px; padding: 0 6px; margin-left: 6px; vertical-align: 1px; }
.import-note { display: flex; gap: 6px; align-items: flex-start; font-size: 13.5px; color: var(--ink-2); margin: 20px 0 0; }
.import-note .icon { color: var(--tangerine); flex-shrink: 0; margin-top: 3px; }
.tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
.tag { font-size: 13px; font-weight: 700; padding: 4px 11px; border-radius: var(--r-pill); background: var(--cobalt-soft); color: var(--cobalt-deep); }
.tag.suggested { background: transparent; border: 1.5px dashed var(--ink-3); color: var(--ink-2); }
.watch-btn { height: 52px; font-size: 16px; }

.notice { display: flex; gap: 14px; margin: 28px 0 0; padding: 18px 20px; border-radius: var(--r-lg); background: var(--paper); border: 2px solid var(--line); }
.notice-warn { background: var(--butter-soft); border-color: var(--butter); }
.notice-doodle { width: 32px; height: 32px; color: var(--tangerine); flex-shrink: 0; }
.notice-title { font-family: var(--font-display); font-size: 18px; margin: 0 0 4px; font-weight: 600; }
.notice p { margin: 0 0 10px; }

.cook-cols { display: grid; grid-template-columns: minmax(280px, 0.8fr) minmax(0, 1.2fr); gap: 40px; margin-top: 40px; align-items: start; }
.ingredients { background: var(--paper); border-radius: var(--r-lg); padding: 24px; position: sticky; top: 16px; border: 1px solid var(--line); }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.stepper { display: inline-flex; align-items: center; background: var(--sand); border-radius: var(--r-pill); padding: 3px; }
.stepper button { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--paper); box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
.stepper button:not(:disabled):active { transform: scale(0.9); }
.stepper-val { padding: 0 12px; font-size: 14px; min-width: 96px; text-align: center; }
.stepper-val strong { font-family: var(--font-display); font-size: 18px; }
.scale-note { background: var(--cobalt-soft); color: var(--cobalt-deep); font-size: 13.5px; font-weight: 500; padding: 6px 12px; border-radius: var(--r-sm); margin: 0 0 10px; }
.ing-list { list-style: none; margin: 0; padding: 0; }
.ing-list li { display: flex; align-items: baseline; gap: 12px; padding: 10px 0; border-bottom: 1px dashed var(--line); font-size: 17px; line-height: 1.45; }
.ing-list li:last-child { border-bottom: 0; }
.ing-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--tangerine); flex-shrink: 0; transform: translateY(-2px); }
.ing-list li:nth-child(3n + 2) .ing-dot { background: var(--cobalt); }
.ing-list li:nth-child(3n) .ing-dot { background: var(--butter); }
.is-scaled .ing-text { animation: flash 0.6s; }
@keyframes flash { 30% { background: var(--butter-soft); } }
.unscaled { font-size: 11.5px; font-weight: 700; color: var(--ink-2); background: var(--sand); padding: 1px 7px; border-radius: var(--r-pill); white-space: nowrap; margin-left: auto; }

.instructions h2 { margin-bottom: 18px; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 20px; }
.steps li { display: flex; gap: 16px; align-items: flex-start; }
.step-num {
  flex-shrink: 0; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 700; font-size: 18px; background: var(--tomato-deep); color: #fff;
}
.steps li:nth-child(4n + 2) .step-num { background: var(--cobalt); }
.steps li:nth-child(4n + 3) .step-num { background: var(--tangerine); color: var(--ink); }
.steps li:nth-child(4n) .step-num { background: var(--butter); color: var(--ink); }
.step-num.sm { width: 30px; height: 30px; font-size: 15px; margin-top: 6px; }
.steps p { margin: 4px 0 0; font-size: 17.5px; line-height: 1.7; max-width: 62ch; }

.nutrition { margin-top: 40px; background: var(--paper); border-radius: var(--r-lg); padding: 4px 24px; border: 1px solid var(--line); }
.nutrition summary { display: flex; align-items: center; gap: 12px; padding: 16px 0; cursor: pointer; list-style: none; }
.nutrition summary::-webkit-details-marker { display: none; }
.summary-chev { margin-left: auto; transition: transform 0.2s; }
.nutrition[open] .summary-chev { transform: rotate(180deg); }
.nutri-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 0 0 12px; }
.nutri-grid div { background: var(--sand); border-radius: var(--r-md); padding: 12px; text-align: center; }
.nutri-grid dt { font-size: 12px; font-weight: 700; color: var(--ink-2); }
.nutri-grid dd { margin: 2px 0 0; font-family: var(--font-display); font-weight: 600; font-size: 22px; }
.nutri-grid small { font-size: 12px; margin-left: 2px; color: var(--ink-2); }

/* ============ Editor ============ */
.editor { max-width: 1000px; margin: 0 auto; }
.editor-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; position: sticky; top: 0; background: var(--cream); padding: 10px 0; z-index: 5; }
.editor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.ed-card { background: var(--paper); border-radius: var(--r-lg); padding: 22px; border: 1px solid var(--line); }
.ed-card .chip-wrap { margin-bottom: 12px; }
.span-2 { grid-column: span 2; }
.ed-title { font-family: var(--font-display); font-size: 20px; font-weight: 600; margin: 0 0 12px; }
.ed-head { display: flex; justify-content: space-between; align-items: center; }
.field-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.field-row.five { grid-template-columns: repeat(5, 1fr); }
.photo-field { display: flex; align-items: center; gap: 14px; }
.photo-preview, .photo-empty { width: 96px; height: 96px; border-radius: var(--r-md); object-fit: cover; flex-shrink: 0; }
.photo-empty { background: var(--sand); display: grid; place-items: center; color: var(--ink-3); }
.ed-ings { list-style: none; margin: 12px 0 8px; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.ed-ings li { display: flex; gap: 6px; align-items: flex-start; }
.canon { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-3); margin-top: 4px; padding-left: 4px; }
.canon input { border: 0; border-bottom: 1px dashed var(--line); background: transparent; font-size: 13px; color: var(--ink-2); outline: 0; padding: 2px 0; width: 220px; max-width: 60%; }
.canon input:focus { border-bottom-color: var(--cobalt); }
.ed-steps { list-style: none; margin: 12px 0 8px; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.ed-steps li { display: flex; gap: 8px; align-items: flex-start; }
.bulk { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; margin: 10px 0; }
.editor-foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }

/* Toasts */
.toasts { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 60; width: max-content; max-width: calc(100vw - 32px); }
.toast { background: var(--ink); color: #fff; padding: 12px 18px; border-radius: var(--r-pill); font-weight: 500; font-size: 14.5px; box-shadow: 0 10px 30px rgba(0,0,0,0.25); animation: toast-in 0.35s var(--spring); display: flex; gap: 12px; align-items: center; }
@keyframes toast-in { from { transform: translateY(20px) scale(0.9); opacity: 0; } }

/* Unlock page */
.unlock { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
.unlock-card { background: var(--paper); border-radius: var(--r-lg); padding: 36px 30px; width: min(400px, 100%); text-align: center; border: 2px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); }
.unlock-card .logo { margin-bottom: 8px; }
.unlock-card p { margin: 0 0 18px; }

/* ============ Responsive ============ */
@media (max-width: 1024px) {
  .library { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .filters-toggle { display: inline-flex; }
}
@media (max-width: 860px) {
  .detail-hero { grid-template-columns: 1fr; gap: 20px; }
  .cook-cols { grid-template-columns: 1fr; gap: 28px; margin-top: 28px; }
  .ingredients { position: static; }
  .editor-grid { grid-template-columns: 1fr; }
  .span-2 { grid-column: auto; }
  .field-row.five { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 640px) {
  .search-row { flex-direction: column; align-items: stretch; }
  .search { height: 54px; }
  .add-btn { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 20; height: 56px; box-shadow: 0 3px 0 #8f2213, 0 10px 24px rgba(201, 51, 31, 0.35); }
  .masonry, .mcol { gap: 12px; }
  .card { border-radius: var(--r-md); }
  .card-body { padding: 10px 12px 12px; }
  .card-title { font-size: 15.5px; }
  .card-meta { font-size: 12.5px; }
  .card-tags { margin-top: 8px; gap: 4px; }
  .mini-tag { font-size: 11px; padding: 1px 7px; }
  .fav-btn { width: 32px; height: 32px; right: 8px; top: 8px; }
  .card-incomplete { font-size: 11px; left: 8px; top: 8px; }
  .facts { grid-template-columns: repeat(2, 1fr); }
  .nutri-grid { grid-template-columns: repeat(3, 1fr); }
  .ingredients { padding: 18px; }
  .ing-list li { font-size: 16.5px; }
  .steps p { font-size: 17px; }
  .add { padding: 28px 18px 20px; }
  .overlay:not(.overlay-sheet) { place-items: end center; padding: 0; }
  .modal-dialog { border-radius: var(--r-lg) var(--r-lg) 0 0; max-height: 92vh; }
  .watch-btn { width: 100%; }
  .toasts { bottom: 88px; }
}

/* ============ Setup & settings ============ */
.setup-card { width: min(460px, 100%); text-align: left; }
.setup-card > .logo, .setup-card > .add-doodle, .setup-card > h1, .setup-card > p.muted { text-align: center; margin-left: auto; margin-right: auto; display: block; }
.setup-card > .logo { display: flex; justify-content: center; }
.setup-card h1 { margin-bottom: 6px; }
.setup-form { margin-top: 18px; text-align: left; }
.hint { font-size: 12.5px; color: var(--ink-2); margin-top: 5px; }
.privacy-note { display: flex; gap: 6px; align-items: flex-start; margin: 0; }
.privacy-note .icon { color: var(--cobalt); flex-shrink: 0; margin-top: 2px; }
.settings { padding: 28px; }
.settings .setup-form { margin-top: 14px; }
.settings-extra { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; padding-top: 16px; border-top: 1px dashed var(--line); }
.form-note { background: var(--butter-soft); padding: 10px 14px; border-radius: var(--r-sm); font-size: 14px; margin: 0; }
.help-toggle { align-self: flex-start; }
.help-list { margin: 0; padding: 12px 14px 12px 30px; background: var(--paper); border-radius: var(--r-md); font-size: 14px; line-height: 1.55; display: flex; flex-direction: column; gap: 6px; border: 1px solid var(--line); }
.shot-video { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: var(--ink); color: #fff; font-size: 11px; font-weight: 700; }
.ph-loading { background: var(--sand); }
.rimg-hero.ph-loading { aspect-ratio: 4 / 3; }

/* ============ Smart add ============ */
.link-chip { display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 12px; border-radius: var(--r-pill); background: var(--cobalt-soft); color: var(--cobalt-deep); font-weight: 700; font-size: 14px; animation: pop-in 0.25s var(--spring); }
.link-chip.bad { background: var(--tomato-soft); color: #8f2213; }
.link-chip-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip-note { font-weight: 500; font-size: 12px; opacity: 0.8; }
.icon-btn.sm { width: 28px; height: 28px; }
.smartzone { position: relative; background: var(--paper); border: 2px solid var(--line); border-radius: var(--r-md); transition: border-color 0.15s; }
.smartzone:focus-within { border-color: var(--cobalt); }
.smart-input { width: 100%; border: 0; outline: 0; resize: vertical; background: transparent; padding: 14px 16px 8px; font-size: 16px; line-height: 1.5; min-height: 80px; }
.smart-input::placeholder { color: var(--ink-3); }
.smartzone .shots { padding: 4px 12px 8px; }
.smartzone-bar { display: flex; align-items: center; justify-content: space-between; padding: 4px 10px 8px 4px; border-top: 1px dashed var(--line); }
.drop-overlay { position: absolute; inset: 0; border-radius: var(--r-md); background: rgba(221, 228, 251, 0.94); border: 2px dashed var(--cobalt); color: var(--cobalt-deep); font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; pointer-events: none; }
.add-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.add-actions .btn { flex: 1; min-width: 160px; }
kbd { font-family: var(--font-body); font-size: 12px; font-weight: 700; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line); background: var(--sand); margin: 0 1px; }

/* ============ Saved for later ============ */
.inbox { background: var(--butter-soft); border: 2px solid var(--butter); border-radius: var(--r-lg); margin-bottom: 18px; overflow: hidden; }
.inbox-head { display: flex; align-items: center; gap: 8px; width: 100%; padding: 12px 16px; font-weight: 700; text-align: left; }
.inbox-title { font-family: var(--font-display); font-size: 17px; font-weight: 600; }
.inbox-chev { margin-left: auto; transition: transform 0.2s; }
.inbox-chev.up { transform: rotate(180deg); }
.inbox-list { list-style: none; margin: 0; padding: 0 10px 10px; display: flex; flex-direction: column; gap: 6px; }
.inbox-item { display: flex; align-items: center; gap: 8px; background: var(--paper); border-radius: var(--r-md); padding: 8px 8px 8px 14px; animation: rise 0.3s var(--ease) both; }
.inbox-main { flex: 1; min-width: 0; display: flex; flex-direction: column; text-align: left; }
.inbox-name { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ============ Settings extras ============ */
.settings-section { padding: 14px 0; border-bottom: 1px dashed var(--line); }
.settings-section p { margin: 4px 0 10px; }
.settings-h { font-family: var(--font-display); font-size: 17px; font-weight: 600; margin: 14px 0 0; }
.settings-section .settings-h { margin-top: 0; }
.bookmarklet { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 16px; border-radius: var(--r-pill); background: var(--tomato-deep); color: #fff; font-weight: 700; text-decoration: none; cursor: grab; box-shadow: var(--shadow-sticker); border: 2px solid var(--ink); transform: rotate(-1.5deg); }
.bookmarklet:active { cursor: grabbing; }
.add-device { display: flex; gap: 14px; align-items: flex-start; }
.qr { width: 150px; flex-shrink: 0; background: #fff; border-radius: var(--r-sm); padding: 6px; border: 1px solid var(--line); }
.qr svg { display: block; width: 100%; height: auto; }
.add-device-form .input { min-width: 180px; }

/* ============ Drop the downloaded Reel ============ */
.dropzone.big { width: 100%; padding: 34px 20px; gap: 6px; border-width: 2.5px; font-size: 16px; }
.dropzone.big .icon { color: var(--tomato-deep); }
.dropzone.over, .is-dragging .dropzone.big { border-color: var(--cobalt); background: var(--cobalt-soft); transform: scale(1.01); }
.shot-video.wide { grid-column: span 3; aspect-ratio: auto; min-height: 96px; flex-direction: row; gap: 10px; padding: 0 36px 0 16px; justify-content: flex-start; border-radius: var(--r-md); }
.shot-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
button.shot-add { cursor: pointer; }
.form-ok { background: var(--cobalt-soft); color: var(--cobalt-deep); font-weight: 500; padding: 10px 14px; border-radius: var(--r-sm); margin: 12px 0 0; font-size: 14px; }
</style>
</head>
